<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>玩家下线</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <link rel="stylesheet" href="css/common.css"/>
    <link rel="stylesheet" href="css/pages.css"/>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js"></script>
</head>
<body>
<div id="app">
    <el-card shadow="never" class="rounded-lg">
        <el-form :model="form" label-width="120px" label-position="left">
            <el-form-item label="玩家ID" required>
                <el-input v-model="form.humanId" placeholder="请输入玩家ID" style="width: 400px;"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="kick" :loading="sending" size="large">
                    执行下线
                </el-button>
                <el-button @click="resetForm" size="large">重置</el-button>
            </el-form-item>
        </el-form>
    </el-card>
</div>

<script>
    const {createApp, reactive, toRefs} = Vue;
    const app = createApp({
        setup() {
            const state = reactive({
                sending: false,
                form: {
                    humanId: '',
                }
            });

            const resetForm = () => {
                state.form = {
                    humanId: '',
                };
            };

            const kick = async () => {
                // 验证必填项
                if (!state.form.humanId || !state.form.humanId.trim()) {
                    ElementPlus.ElMessage.warning('请输入玩家ID');
                    return;
                }

                // 构建请求数据
                const requestData = {
                    humanId: state.form.humanId.trim(),
                };

                state.sending = true;
                try {
                    const res = await fetch('/api/gm/kick', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': localStorage.getItem('admin_token')
                        },
                        body: JSON.stringify(requestData)
                    });

                    if (res.status === 401) {
                        handleLoginExpired();
                        return;
                    }

                    const json = await res.json();
                    if (json.code === 200) {
                        ElementPlus.ElMessage.success('玩家下线指令已发送');
                        resetForm();
                    } else {
                        ElementPlus.ElMessage.error(json.msg || '发送失败');
                    }
                } catch (e) {
                    console.error(e);
                    ElementPlus.ElMessage.error('网络错误，请重试');
                } finally {
                    state.sending = false;
                }
            };

            return {
                ...toRefs(state),
                resetForm,
                kick
            };
        }
    });

    app.use(ElementPlus);
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component)
    }
    app.mount('#app');
</script>
</body>
</html>
