<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>游戏服务器管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <link rel="stylesheet" href="css/common.css"/>
    <link rel="stylesheet" href="css/index.css"/>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
</head>
<body>

<div id="app">
    <div v-if="!sessionReady" class="login-container min-h-screen flex items-center justify-center">
        <div class="text-gray-500">加载中...</div>
    </div>
    <div v-else-if="!isLoggedIn" class="login-container min-h-screen flex items-center justify-center">
        <el-card class="login-card w-96 rounded-xl relative z-10">
            <template #header>
                <div class="text-center">Sunrise Game Frame</div>
            </template>
            <el-form label-position="top" class="px-2">
                <el-form-item label="账号" class="mb-6">
                    <el-input v-model="form.user" prefix-icon="User" placeholder="请输入账号" size="large"></el-input>
                </el-form-item>
                <el-form-item label="密码" class="mb-6">
                    <el-input v-model="form.pass" type="password" prefix-icon="Lock" placeholder="请输入密码"
                              @keyup.enter="handleLogin" size="large"></el-input>
                </el-form-item>
                <el-button type="primary" class="login-button w-full mt-4" @click="handleLogin" :loading="loading"
                           size="large">
                    登录
                </el-button>
            </el-form>
        </el-card>
    </div>

    <el-container v-else class="h-screen overflow-hidden">
        <el-aside width="220px" class="sidebar-wrapper">
            <div class="logo-area">
                <h1 class="text-lg font-bold text-blue-600 flex items-center gap-2">
                    Sunrise Game Frame
                </h1>
            </div>

            <el-menu :default-active="activeTab" class="flex-1" @select="handleSelect">
                <el-menu-item index="monitor" v-if="hasPermission('monitor')">
                    <el-icon>
                        <House/>
                    </el-icon>
                    <span>节点监控</span>
                </el-menu-item>
                <el-menu-item index="server_status" v-if="hasPermission('server_status')">
                    <el-icon>
                        <Open/>
                    </el-icon>
                    <span>服务器关闭</span>
                </el-menu-item>
                <el-menu-item index="online_player" v-if="hasPermission('online_player')">
                    <el-icon>
                        <User/>
                    </el-icon>
                    <span>在线玩家</span>
                </el-menu-item>
                <el-menu-item index="config_update" v-if="hasPermission('config_update')">
                    <el-icon>
                        <Refresh/>
                    </el-icon>
                    <span>配置更新</span>
                </el-menu-item>
                <el-menu-item index="hotswap_jar" v-if="hasPermission('hotswap_jar')">
                    <el-icon>
                        <Upload/>
                    </el-icon>
                    <span>代码热更</span>
                </el-menu-item>
                <el-menu-item index="send_mail" v-if="hasPermission('send_mail')">
                    <el-icon>
                        <Message/>
                    </el-icon>
                    <span>发送邮件</span>
                </el-menu-item>
                <el-menu-item index="kick_human" v-if="hasPermission('kick_human')">
                    <el-icon>
                        <Delete/>
                    </el-icon>
                    <span>玩家下线</span>
                </el-menu-item>
                <el-menu-item index="ban_player" v-if="hasPermission('ban_player')">
                    <el-icon>
                        <Lock/>
                    </el-icon>
                    <span>玩家封禁</span>
                </el-menu-item>
                <el-menu-item index="mute_player" v-if="hasPermission('mute_player')">
                    <el-icon>
                        <Mute/>
                    </el-icon>
                    <span>玩家禁言</span>
                </el-menu-item>
                <el-menu-item index="whitelist" v-if="hasPermission('whitelist')">
                    <el-icon>
                        <Key/>
                    </el-icon>
                    <span>白名单</span>
                </el-menu-item>
                <el-menu-item index="announcement" v-if="hasPermission('announcement')">
                    <el-icon>
                        <Bell/>
                    </el-icon>
                    <span>全服公告</span>
                </el-menu-item>
                <el-menu-item index="cdk" v-if="hasPermission('cdk')">
                    <el-icon>
                        <Ticket/>
                    </el-icon>
                    <span>兑换码</span>
                </el-menu-item>
                <el-menu-item index="operation_log" v-if="hasPermission('operation_log')">
                    <el-icon>
                        <Document/>
                    </el-icon>
                    <span>操作记录</span>
                </el-menu-item>
                <el-menu-item index="user_manager" v-if="isAdmin">
                    <el-icon>
                        <Edit/>
                    </el-icon>
                    <span>用户管理</span>
                </el-menu-item>
            </el-menu>
            <div class="sidebar-footer">
                <a
                        href="https://gitee.com/lieng618/sunrise-game-frame"
                        target="_blank"
                        class="text-gray-500 hover:text-blue-600 transition-colors no-underline"
                >
                    sunrise-game-frame@lieng
                </a>
            </div>
        </el-aside>

        <el-container class="flex flex-col h-full">
            <el-header class="main-header flex items-center justify-between px-6" style="height: 60px;">
                <div class="page-title">
                    {{ pageTitle }}
                </div>

                <div class="flex items-center gap-4">
                    <el-dropdown>
                        <span class="user-dropdown el-dropdown-link flex items-center gap-2 cursor-pointer text-gray-700">
                            <span class="font-medium">{{ form.user || '管理员' }}</span>
                        </span>
                        <template #dropdown>
                            <el-dropdown-menu>
                                <el-dropdown-item @click="logout" divided>
                                    <el-icon class="mr-2">
                                        <Switch/>
                                    </el-icon>
                                    退出登录
                                </el-dropdown-item>
                            </el-dropdown-menu>
                        </template>
                    </el-dropdown>
                </div>
            </el-header>

            <el-main style="padding: 0; overflow: hidden; position: relative;">
                <div v-if="!hasAnyPagePermission" class="flex items-center justify-center h-full text-gray-500">
                    暂无页面访问权限，请联系管理员分配权限后重新登录
                </div>
                <iframe v-else :src="currentSrc" ref="contentFrame"></iframe>
            </el-main>
        </el-container>
    </el-container>
</div>

<script>
    const {createApp, reactive, toRefs, onMounted, computed, ref} = Vue;

    const app = createApp({
        setup() {
            const state = reactive({
                isLoggedIn: false,
                loading: false, // 登录按钮loading
                form: {user: '', pass: ''},

                activeTab: 'monitor', // 当前选中的菜单
                // 定义菜单 index 到文件名的映射
                menuMap: {
                    'monitor': 'monitor.html',
                    'server_status': 'server_status.html',
                    'online_player': 'online_player.html',
                    'config_update': 'config_update.html',
                    'hotswap_jar': 'hotswap_jar.html',
                    'send_mail': 'send_mail.html',
                    'kick_human': 'kick_human.html',
                    'ban_player': 'ban_player.html',
                    'mute_player': 'mute_player.html',
                    'whitelist': 'whitelist.html',
                    'announcement': 'announcement.html',
                    'cdk': 'cdk.html',
                    'operation_log': 'operation_log.html',
                    'user_manager': 'user_manager.html',
                },
                isAdmin: false, // 是否为管理员
                permissions: [], // 当前用户页面权限
                sessionReady: false // 会话信息是否已加载完成
            });

            const hasPermission = (pageKey) => {
                if (state.isAdmin) return true;
                const perms = state.permissions;
                return Array.isArray(perms) && perms.includes(pageKey);
            };

            const hasAnyPagePermission = computed(() => {
                if (state.isAdmin) return true;
                return Object.keys(state.menuMap).some(key => {
                    if (key === 'user_manager') return false;
                    return hasPermission(key);
                });
            });

            const savePermissions = (permissions, isAdmin) => {
                state.permissions = permissions || [];
                state.isAdmin = !!isAdmin;
                localStorage.setItem('admin_permissions', JSON.stringify(state.permissions));
                localStorage.setItem('admin_is_admin', state.isAdmin ? '1' : '0');
            };

            const loadPermissionsFromStorage = () => {
                try {
                    const saved = localStorage.getItem('admin_permissions');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        state.permissions = Array.isArray(parsed) ? parsed : [];
                    }
                    state.isAdmin = localStorage.getItem('admin_is_admin') === '1';
                } catch (e) {
                    state.permissions = [];
                    state.isAdmin = false;
                }
            };

            const applyLegacySession = async (token) => {
                const savedPerms = localStorage.getItem('admin_permissions');
                if (savedPerms !== null) {
                    try {
                        const parsed = JSON.parse(savedPerms);
                        state.permissions = Array.isArray(parsed) ? parsed : [];
                    } catch (e) {
                        state.permissions = [];
                    }
                } else {
                    state.permissions = [];
                }
                try {
                    const res = await fetch('/api/users', {headers: {'Authorization': token}});
                    state.isAdmin = res.status === 200 && (await res.json()).code === 200;
                } catch (e) {
                    state.isAdmin = false;
                }
                savePermissions(state.permissions, state.isAdmin);
                state.isLoggedIn = true;
                return true;
            };

            const refreshSession = async () => {
                const token = localStorage.getItem('admin_token');
                if (!token) {
                    state.isLoggedIn = false;
                    return false;
                }
                try {
                    const res = await fetch('/api/auth/info', {
                        headers: {'Authorization': token}
                    });
                    if (res.status === 401) {
                        localStorage.removeItem('admin_token');
                        localStorage.removeItem('admin_username');
                        localStorage.removeItem('admin_permissions');
                        localStorage.removeItem('admin_is_admin');
                        state.isLoggedIn = false;
                        state.permissions = [];
                        state.isAdmin = false;
                        return false;
                    }
                    if (res.ok) {
                        const data = await res.json();
                        if (data.code === 200 && data.data) {
                            savePermissions(data.data.permissions, data.data.isAdmin);
                            if (data.data.username) {
                                state.form.user = data.data.username;
                                localStorage.setItem('admin_username', data.data.username);
                            }
                            state.isLoggedIn = true;
                            return true;
                        }
                    }
                    return await applyLegacySession(token);
                } catch (e) {
                    console.error('刷新会话失败，使用本地缓存', e);
                    return await applyLegacySession(token);
                }
            };

            const getFirstAllowedTab = () => {
                const order = Object.keys(state.menuMap);
                for (const key of order) {
                    if (key === 'user_manager') {
                        if (state.isAdmin) return key;
                        continue;
                    }
                    if (hasPermission(key)) return key;
                }
                return null;
            };

            const ensureActiveTabAllowed = () => {
                if (state.activeTab === 'user_manager' && !state.isAdmin) {
                    state.activeTab = getFirstAllowedTab();
                    return;
                }
                if (state.activeTab && state.activeTab !== 'user_manager' && !hasPermission(state.activeTab)) {
                    state.activeTab = getFirstAllowedTab();
                }
            };

            const pageTitle = computed(() => {
                if (state.activeTab === 'monitor') return '节点监控';
                if (state.activeTab === 'server_status') return '服务器关闭';
                if (state.activeTab === 'online_player') return '在线玩家';
                if (state.activeTab === 'config_update') return '配置更新';
                if (state.activeTab === 'hotswap_jar') return '代码热更';
                if (state.activeTab === 'send_mail') return '发送邮件';
                if (state.activeTab === 'kick_human') return '玩家下线';
                if (state.activeTab === 'ban_player') return '玩家封禁';
                if (state.activeTab === 'mute_player') return '玩家禁言';
                if (state.activeTab === 'whitelist') return '白名单';
                if (state.activeTab === 'announcement') return '全服公告';
                if (state.activeTab === 'cdk') return '兑换码';
                if (state.activeTab === 'operation_log') return '操作记录';
                if (state.activeTab === 'user_manager') return '用户管理';
                return '';
            });

            const currentSrc = computed(() => {
                if (!state.activeTab) return 'about:blank';
                if (state.activeTab === 'user_manager' && state.isAdmin) {
                    return state.menuMap[state.activeTab];
                }
                if (!hasPermission(state.activeTab)) return 'about:blank';
                return state.menuMap[state.activeTab] || 'about:blank';
            });

            // --- 登录逻辑 ---
            const handleLogin = async () => {
                if (!state.form.user || !state.form.pass) {
                    ElementPlus.ElMessage.warning('请输入账号密码');
                    return;
                }
                state.loading = true;
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(state.form)
                    });
                    const data = await res.json();

                    if (data.code === 200) {
                        localStorage.setItem('admin_token', data.token);
                        localStorage.setItem('admin_username', state.form.user);
                        if (Array.isArray(data.permissions)) {
                            savePermissions(data.permissions, data.isAdmin);
                        } else {
                            await refreshSession();
                        }
                        state.isLoggedIn = true;
                        state.activeTab = getFirstAllowedTab();
                        ensureActiveTabAllowed();
                        ElementPlus.ElMessage.success('登录成功');
                    } else {
                        ElementPlus.ElMessage.error(data.msg || '登录失败');
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('网络连接错误');
                } finally {
                    state.loading = false;
                }
            };

            // --- 登出逻辑 ---
            const logout = () => {
                state.isLoggedIn = false;
                state.form.pass = ''; // 清空密码
                state.form.user = ''; // 清空用户名
                localStorage.removeItem('admin_token');
                localStorage.removeItem('admin_username');
                localStorage.removeItem('admin_permissions');
                localStorage.removeItem('admin_is_admin');
                state.permissions = [];
                state.isAdmin = false;
                ElementPlus.ElMessage.success('已退出登录');
            };

            // --- 菜单切换 ---
            const handleSelect = (index) => {
                if (index === 'user_manager' && !state.isAdmin) {
                    ElementPlus.ElMessage.warning('权限不足：只有管理员可以访问用户管理');
                    return;
                }
                if (index !== 'user_manager' && !hasPermission(index)) {
                    ElementPlus.ElMessage.warning('权限不足：无法访问该页面');
                    return;
                }
                state.activeTab = index;
            };

            // --- 初始化 ---
            onMounted(async () => {
                const token = localStorage.getItem('admin_token');
                if (token) {
                    const savedUsername = localStorage.getItem('admin_username');
                    if (savedUsername) {
                        state.form.user = savedUsername;
                    }
                    loadPermissionsFromStorage();
                    const ok = await refreshSession();
                    if (ok) {
                        state.activeTab = getFirstAllowedTab();
                        ensureActiveTabAllowed();
                    }
                }
                state.sessionReady = true;
            });

            return {
                ...toRefs(state),
                handleLogin,
                logout,
                handleSelect,
                pageTitle,
                currentSrc,
                hasPermission,
                hasAnyPagePermission
            };
        }
    });

    app.use(ElementPlus);
    // 注册所有图标
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component)
    }
    app.mount('#app');
</script>
</body>
</html>
