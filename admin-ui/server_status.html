<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>服务器关闭</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <link rel="stylesheet" href="css/common.css"/>
    <link rel="stylesheet" href="css/pages.css"/>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js"></script>
</head>
<body>
<div id="app">
    <el-card shadow="never" class="rounded-lg">
        <el-form label-width="150px" label-position="left">
            <el-form-item label="禁止新客户端连接">
                <div class="flex items-center gap-3" style="width: 400px;">
                    <el-switch
                            v-model="isClosed"
                            active-color="#409EFF"
                            inactive-color="#67C23A"
                            size="default"
                            :loading="loading"
                            @change="handleSwitch">
                    </el-switch>
                    <span class="font-medium" :class="isClosed ? 'text-blue-500' : 'text-green-500'">
                        {{ isClosed ? '服务器已关闭' : '服务器已开启' }}
                    </span>
                </div>
            </el-form-item>
        </el-form>
    </el-card>
</div>

<script>
    const {createApp, reactive, toRefs, onMounted} = Vue;
    const app = createApp({
        setup() {
            const state = reactive({
                isClosed: false,
                loading: false
            });

            const fetchStatus = async () => {
                try {
                    const res = await fetch('/api/server-status', {
                        headers: {'Authorization': localStorage.getItem('admin_token')}
                    });
                    if (res.status === 401) {
                        handleLoginExpired();
                        return;
                    }
                    const json = await res.json();
                    if (json.code === 200) {
                        state.isClosed = !json.data.open;
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleSwitch = async (val) => {
                try {
                    await ElementPlus.ElMessageBox.confirm(
                        val ? '确定要关闭服务器吗？关闭后客户端将无法连接！' : '确定要开启服务器吗？开启后客户端可以正常连接。',
                        val ? '关闭服务器确认' : '开启服务器确认',
                        {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    );
                } catch (e) {
                    state.isClosed = !val;
                    return;
                }

                state.loading = true;
                try {
                    const res = await fetch('/api/server-status', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': localStorage.getItem('admin_token')
                        },
                        body: JSON.stringify({open: !val})
                    });
                    if (res.status === 401) {
                        handleLoginExpired();
                        return;
                    }
                    const json = await res.json();
                    if (json.code === 200) {
                        ElementPlus.ElMessage.success(val ? '服务器已关闭' : '服务器已开启');
                    } else {
                        state.isClosed = !val;
                        ElementPlus.ElMessage.error(json.msg || '操作失败');
                    }
                } catch (e) {
                    state.isClosed = !val;
                    ElementPlus.ElMessage.error('网络错误，请重试');
                } finally {
                    state.loading = false;
                }
            };

            onMounted(() => {
                fetchStatus();
            });

            return {
                ...toRefs(state),
                handleSwitch
            };
        }
    });

    app.use(ElementPlus);
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component)
    }
    app.mount('#app');
</script>
</body>
</html>
