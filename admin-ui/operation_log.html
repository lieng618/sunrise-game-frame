<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>操作记录</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <link rel="stylesheet" href="css/common.css"/>
    <link rel="stylesheet" href="css/pages.css"/>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js"></script>
</head>
<body>
<div id="app">
    <el-card shadow="never" class="rounded-lg">
        <template #header>
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <el-select v-model="queryForm.operationType" placeholder="筛选操作类型" clearable
                               style="width: 160px" size="default" @change="handleFilterChange"
                               @clear="handleClearFilter">
                        <el-option label="全部" value=""></el-option>
                        <el-option label="登录" value="LOGIN"></el-option>
                        <el-option label="发送邮件" value="SEND_MAIL"></el-option>
                        <el-option label="踢出玩家" value="KICK_PLAYER"></el-option>
                        <el-option label="热更配置" value="RELOAD_CONFIG"></el-option>
                        <el-option label="切换节点状态" value="TOGGLE_NODE"></el-option>
                        <el-option label="用户管理" value="USER_MANAGER"></el-option>
                        <el-option label="封禁玩家" value="BAN_PLAYER"></el-option>
                        <el-option label="解封玩家" value="UNBAN_PLAYER"></el-option>
                        <el-option label="其他操作" value="OTHER"></el-option>
                    </el-select>
                </div>
            </div>
        </template>
        <el-table :data="tableData" stripe style="width: 100%" v-loading="loadingData" border>

            <el-table-column prop="createTime" label="操作时间" width="200" sortable>
                <template #default="scope">
                    <div class="flex items-center text-gray-600">
                        <el-icon class="mr-1">
                            <Clock/>
                        </el-icon>
                        {{ formatTime(scope.row.createTime) }}
                    </div>
                </template>
            </el-table-column>

            <el-table-column prop="operator" label="操作人员" width="180">
                <template #default="scope">
                    <div class="flex items-center font-medium text-gray-700">
                        {{ scope.row.operator }}
                    </div>
                </template>
            </el-table-column>

            <el-table-column prop="ip" label="IP 地址" width="180">
                <template #default="scope">
                    <span class="ip-badge">
                        {{ scope.row.ip }}
                    </span>
                </template>
            </el-table-column>

            <el-table-column prop="operationType" label="操作类型" width="150">
                <template #default="scope">
                    <span class="operation-type" :class="scope.row.operationType">
                        {{ getOperationTypeDesc(scope.row.operationType) }}
                    </span>
                </template>
            </el-table-column>

            <el-table-column prop="action" label="操作行为" min-width="300">
                <template #default="scope">
                    <span class="text-gray-800">
                        {{ scope.row.action }}
                    </span>
                </template>
            </el-table-column>
        </el-table>

        <div class="flex justify-end mt-4">
            <el-pagination
                    v-model:current-page="pagination.page"
                    v-model:page-size="pagination.size"
                    :page-sizes="[10, 20, 50, 100]"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="pagination.total"
                    @size-change="fetchLogs"
                    @current-change="fetchLogs"></el-pagination>
        </div>
    </el-card>
</div>

<script>
    const {createApp, reactive, toRefs, onMounted} = Vue;

    const app = createApp({
        setup() {
            const state = reactive({
                loadingData: false,
                tableData: [],
                // 查询表单
                queryForm: {
                    operationType: ''
                },
                // 分页配置
                pagination: {
                    page: 1,
                    size: 20,
                    total: 0
                }
            });

            // 获取日志列表
            const fetchLogs = async () => {
                state.loadingData = true;
                try {
                    // 构造查询参数
                    const params = new URLSearchParams({
                        page: state.pagination.page,
                        size: state.pagination.size
                    });

                    // 添加操作类型筛选
                    if (state.queryForm.operationType) {
                        params.append('operationType', state.queryForm.operationType);
                    }

                    // API 路径为 /api/logs
                    const res = await fetch(`/api/logs?${params.toString()}`, {
                        headers: {'Authorization': localStorage.getItem('admin_token')}
                    });

                    if (res.status === 401) {
                        if (typeof handleLoginExpired === 'function') handleLoginExpired();
                        return;
                    }

                    const json = await res.json();
                    if (json.code === 200) {
                        // 后端返回结构: { data: { list: [], total: 100 } }
                        state.tableData = json.data.list || [];
                        state.pagination.total = json.data.total || 0;
                    }
                } catch (e) {
                    console.error("获取日志失败", e);
                } finally {
                    state.loadingData = false;
                }
            };

            // 筛选变化时自动请求数据
            const handleFilterChange = () => {
                state.pagination.page = 1; // 筛选时重置到第一页
                fetchLogs();
            };

            // 清除筛选时请求全部数据
            const handleClearFilter = () => {
                state.queryForm.operationType = '';
                state.pagination.page = 1; // 重置到第一页
                fetchLogs();
            };

            const formatTime = (ts) => {
                if (!ts) return '-';
                return new Date(ts).toLocaleString();
            };

            // 操作类型描述映射
            const getOperationTypeDesc = (type) => {
                const typeMap = {
                    'LOGIN': '登录',
                    'SEND_MAIL': '发送邮件',
                    'KICK_PLAYER': '踢出玩家',
                    'RELOAD_CONFIG': '热更配置',
                    'TOGGLE_NODE': '切换节点状态',
                    'USER_MANAGER': '用户管理',
                    'BAN_PLAYER': '封禁玩家',
                    'UNBAN_PLAYER': '解封玩家',
                    'OTHER': '其他操作'
                };
                return typeMap[type] || type || '未知';
            };

            onMounted(() => {
                fetchLogs();
            });

            return {
                ...toRefs(state),
                fetchLogs,
                handleFilterChange,
                handleClearFilter,
                formatTime,
                getOperationTypeDesc
            };
        }
    });

    app.use(ElementPlus);
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component)
    }
    app.mount('#app');
</script>
</body>
</html>
