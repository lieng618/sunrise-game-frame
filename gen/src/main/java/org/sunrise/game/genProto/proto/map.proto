syntax = "proto3";
option java_outer_classname = "MapProto";
package org.sunrise.game.genProto.gen;

// 上线后客户端收到S2C_LastMap，玩家选择进入C2S_Enter，给地图内其他玩家广播S2C_UnitEnter，此玩家收到S2C_UnitEnter + S2C_SceneSync

enum FROM_CLIENT {
  C2S_Enter = 0; // 进入地图
  C2S_Move = 1;  // 移动
  C2S_Leave = 2; // 离开地图
}

enum FROM_SERVER {
  S2C_SceneSync = 0;           // 进图全量同步（单位信息 + 位置 + 属性）
  S2C_UnitEnter = 1;           // 单位进入
  S2C_UnitLeave = 2;           // 单位离开
  S2C_UnitPositionUpdate = 3;  // 位置变化
  S2C_UnitAttributeUpdate = 4; // 属性变化
  S2C_LastMap = 5;             // 上次所在地图
}

message STUnitInfo {
  string unit_id = 1;
  uint32 unit_type = 2;
  uint32 config_id = 3;
  string name = 4;
}

message STUnitPosition {
  string unit_id = 1;
  float pos_x = 2;
  float pos_y = 3;
  float pos_z = 4;
  float orientation = 5;
}

message STAttributeValue {
  uint32 attribute_type = 1;
  uint64 final_value = 2;
}

// 单个单位的全部属性
message STUnitAttributes {
  string unit_id = 1;
  repeated STAttributeValue attributes = 2;
}

message MC2S_Enter {
  uint32 id = 1; // 地图id
}

message MC2S_Move {
  float mapPostX = 1;
  float mapPostY = 2;
  float mapPostZ = 3;
  float Orientation = 4;
}

message MC2S_Leave {
  uint32 id = 1; // 地图id
}

message MS2C_SceneSync {
  repeated STUnitInfo units = 1;
  repeated STUnitPosition positions = 2;
  repeated STUnitAttributes unit_attributes = 3;
}

message MS2C_UnitEnter {
  STUnitInfo unit = 1;
  STUnitPosition position = 2;
  STUnitAttributes attributes = 3;
}

message MS2C_UnitLeave {
  string unit_id = 1;
}

message MS2C_UnitPositionUpdate {
  STUnitPosition position = 1;
}

message MS2C_UnitAttributeUpdate {
  STUnitAttributes attributes = 1;
}

message MS2C_LastMap {
  uint32 id = 1; // 地图id
}
