syntax = "proto3";
option java_outer_classname = "MailProto";
package org.sunrise.game.genProto.gen;

enum FROM_CLIENT {
  C2S_GetMailList = 0;        // 获取邮件列表（空消息）
  C2S_ReadMail = 1;           // 读取邮件（标记为已读）
  C2S_ReceiveMailAttachment = 2;  // 领取邮件附件
  C2S_DeleteMail = 3;         // 删除邮件
}

enum FROM_SERVER {
  S2C_GetMailList = 0;        // 邮件列表响应
  S2C_NewMail = 1;            // 新邮件通知
  S2C_MailUpdate = 2;         // 邮件更新（状态变化）
}

// 邮件附件信息
message STMailAttachment {
  uint32 itemId = 1;          // 奖励物品ID
  uint32 count = 2;           // 奖励数量
}

// 邮件信息
message STMailInfo {
  uint64 mailId = 1;          // 邮件ID
  uint32 templateId = 2;      // 模板ID（客户端读取模板）
  repeated STMailAttachment attachments = 3;  // 附件列表
  int32 status = 4;           // 状态：0-未读，1-已读，2-已领取
  int64 createTime = 5;       // 创建时间（时间戳）
  string senderName = 6;      // 发送者名称（可选）
}

// 邮件列表响应
message MS2C_GetMailList {
  repeated STMailInfo mails = 1;  // 邮件列表
}

// 读取邮件请求
message MC2S_ReadMail {
  uint64 mailId = 1;          // 邮件ID
}

// 领取邮件附件请求
message MC2S_ReceiveMailAttachment {
  uint64 mailId = 1;          // 邮件ID
}

// 删除邮件请求
message MC2S_DeleteMail {
  uint64 mailId = 1;          // 邮件ID
}

// 新邮件通知
message MS2C_NewMail {
  STMailInfo mail = 1;        // 新邮件信息
}

// 邮件更新通知
message MS2C_MailUpdate {
  uint64 mailId = 1;          // 邮件ID
  int32 status = 2;           // 新状态 1-已读，2-已领取，3-已删除
}
