syntax = "proto3";
option java_outer_classname = "ChatProto";
package org.sunrise.game.genProto.gen;

enum FROM_CLIENT {
  C2S_Chat = 0;
  C2S_Horn = 1;
  C2S_GetHistory = 2;  // 获取历史记录请求
  C2S_CDK = 3; // 使用cdk
}

enum FROM_SERVER {
  S2C_Chat = 0;     // 实时聊天消息
  S2C_Horn = 1;     // 大喇叭
  S2C_History = 2;  // 历史记录响应
  S2C_Tips = 3;     // 提示消息
}

message MC2S_Chat {
  string msg = 1;  // 消息内容
}

message MC2S_CDK {
  string code = 1;  // 兑换码内容
}

message MS2C_Chat {
  string id = 1;     // 玩家id
  string msg = 2;    // 消息内容
  int64 time = 3;    // 时间戳（毫秒级）
  string name = 4;   // 玩家名字
}

message MC2S_GetHistory {
  int32 count = 1;  // 请求的历史记录条数
}

message MS2C_History {
  repeated MS2C_Chat history = 1;  // 历史记录列表
}

message MS2C_Tips {
  int32 id = 1;       // 提示配置表的id，如果大于1，客户端优先从配置表中读取
  string msg = 2;     // 消息内容
}