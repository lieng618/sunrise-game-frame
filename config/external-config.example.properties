# =============================================================================
# ExternalServer config template (copy to external-config.properties)
# =============================================================================

# --- Database (jdbc.*) ---

jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/sunrise}
jdbc.user=${JDBC_USER:root}
jdbc.password=${JDBC_PASSWORD:123456}
jdbc.pool.maximum-size=5
jdbc.pool.minimum-idle=3
jdbc.pool.connection-timeout=30000
jdbc.pool.idle-timeout=600000
jdbc.pool.max-lifetime=1800000

# --- Center server (master.*) ---

# Center server ID; 0 means do not connect to center
master.id=1
master.address=${MASTER_ADDRESS:127.0.0.1}
master.port=8000

# --- Node addresses (report.* / external.*) ---

# IP reported to center server (used by other nodes to connect here)
report.address=${REPORT_ADDRESS:127.0.0.1}
# Public IP exposed to game clients (returned by Http server)
external.address=${EXTERNAL_ADDRESS:127.0.0.1}

# --- Protocol listeners (external.listen.*) ---

external.listen.tcp=true
external.listen.ws=true
external.listen.kcp=true

# --- External port allocation (external.listen.*) ---

# Optional: pin the TCP port explicitly (WS = port + 1, KCP = port + 2).
# Leave empty to probe upward from base-port.
external.listen.port=${EXTERNAL_LISTEN_PORT:}
# Base port for auto allocation
external.listen.base-port=10000
# Number of ports to scan from base-port, must be >= 3
external.listen.port-range=100

# --- Rate limit (external.rate-limit.*) ---

# Long-term refill rate per connection (token bucket)
external.rate-limit.refill-per-minute=1200
# Maximum burst after an idle period
external.rate-limit.burst=120
# Close a connection that generates too many rejections in this window
external.rate-limit.abuse-window-seconds=5
external.rate-limit.abuse-threshold=600
# Log at most one rate-limit warning per connection at this interval
external.rate-limit.log-interval-ms=1000

# --- RPC node identity (rpc.node.*) ---

rpc.node.type=external
rpc.node.server-id=100

# --- RPC registration (rpc.scan.*) ---

# Comma-separated @RpcService scan packages (required)
rpc.scan.packages=org.sunrise.game.external.service
rpc.call-enum-class=org.sunrise.game.genRpc.gen.CallEnum

# --- Logging (log.*) ---

log.level=DEBUG

# --- RPC handshake auth (rpc.*) ---

# Shared secret for internal RPC handshake; ALL rpc nodes and center must use the same value.
# The generated development default can be overridden cluster-wide via RPC_AUTH_TOKEN.
rpc.auth-token=${RPC_AUTH_TOKEN:5cb541524f98cebbdc4d650cb1df3feca5a91c63bb084da88f5fd26c54a8d395}
