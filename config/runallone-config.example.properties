# =============================================================================
# Single-process (all-in-one) config template (copy to runallone-config.properties)
# Runs External + Game + Http + GmBack in one JVM
# =============================================================================

# --- Database (jdbc.*) ---

jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/sunrise}
jdbc.user=${JDBC_USER:root}
jdbc.password=${JDBC_PASSWORD:123456}
jdbc.pool.maximum-size=5
jdbc.pool.minimum-idle=3
jdbc.pool.connection-timeout=30000
jdbc.pool.idle-timeout=600000
jdbc.pool.max-lifetime=1800000

# --- Center server (master.*) ---

# 0 = do not connect to center server (required for all-in-one mode)
master.id=0
master.address=${MASTER_ADDRESS:127.0.0.1}
master.port=8000

# --- Node addresses (report.* / external.*) ---

report.address=${REPORT_ADDRESS:127.0.0.1}
external.address=${EXTERNAL_ADDRESS:127.0.0.1}

# --- Protocol listeners (external.listen.*) ---

external.listen.tcp=true
external.listen.ws=true
external.listen.kcp=true

# --- Rate limit (external.rate-limit.*) ---

# Raise for local stress testing
external.rate-limit.per-minute=10000000

# --- RPC node identity (rpc.node.*) ---

# Single-process mode does not connect to center (master.id=0); type is used for log name and identity only
rpc.node.type=runallone
rpc.node.server-id=100

# --- RPC registration (rpc.scan.*) ---

# All-in-one must scan org.sunrise.game to cover external/game/http/gmback *Service packages
rpc.scan.packages=org.sunrise.game
# Generated CallEnum class; rpcId binds to @RpcMethod via matching field names
rpc.call-enum-class=org.sunrise.game.genRpc.gen.CallEnum

# --- Logging (log.*) ---

log.level=INFO

# --- Config tables (config.*) ---

config.path=${CONFIG_PATH:../tables/json}
config.nav.path=${CONFIG_NAV_PATH:../tables/mapjson}

# --- GM admin API (admin.*) ---

admin.user=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:sunrise}
admin.port=8010
admin.jwt.expiration=864000000

# --- HTTP service (http.*) ---

http.port=8090

# --- Login queue (login.queue.*) ---

login.queue.max-per-second=100

# --- Player auth (player.*) ---

player.auth.enabled=false
player.jwt.secret=${PLAYER_JWT_SECRET:sunrise-player-jwt-secret-change-me-in-production-32b}
player.jwt.expiration=86400000

# --- Mail (mail.smtp.*) ---

mail.smtp.username=${MAIL_SMTP_USERNAME:xxx@qq.com}
mail.smtp.password=${MAIL_SMTP_PASSWORD:xxx}
