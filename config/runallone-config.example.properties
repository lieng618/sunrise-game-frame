jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/sunrise}
jdbc.user=${JDBC_USER:root}
jdbc.password=${JDBC_PASSWORD:123456}
jdbc.maximumPoolSize=5
jdbc.minimumIdle=3
jdbc.connectionTimeout=30000
jdbc.idleTimeout=600000
jdbc.maxLifetime=1800000

# connect master
# id = 0 not connect master
master.id=0
master.address=${MASTER_ADDRESS:127.0.0.1}
master.port=8000
report.address=${REPORT_ADDRESS:127.0.0.1}
# external report address
external.address=${EXTERNAL_ADDRESS:127.0.0.1}

external.listen.tcp=true
external.listen.ws=true
external.listen.kcp=true
# The maximum number of messages received by a single client per minute
external.msgcountpermin = 10000000

rpc.node.type=game
rpc.node.serverId=100

# Options: TRACE, DEBUG, INFO, WARN, ERROR
log.level=INFO

# config path
config.path=${CONFIG_PATH:../tables/json}

# map nav path ({mapId}.nav.json)
config.nav.path=${CONFIG_NAV_PATH:../tables/mapjson}

admin.user=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:sunrise}
admin.port=8010
admin.jwt.expiration=864000000

# http bind
http.port=8090

# login queue: max logins allowed per second (direct + dequeue)
login.queue.maxPerSecond=100

# player auth
player.auth.enabled=false
player.jwt.secret=${PLAYER_JWT_SECRET:sunrise-player-jwt-secret-change-me-in-production-32b}
player.jwt.expiration=86400000
mail.smtp.username=${MAIL_SMTP_USERNAME:xxx@qq.com}
mail.smtp.password=${MAIL_SMTP_PASSWORD:xxx}
