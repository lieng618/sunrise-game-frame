# =============================================================================
# CenterServer config template (copy to center-config.properties)
# Naming: service.category.name, lowercase, hyphen for multi-word segments
# Format: key=value (no spaces around =)
# =============================================================================

# --- Database (jdbc.*) ---

# MySQL JDBC URL; supports ${JDBC_URL:default} placeholder
jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/sunrise}
# Database username
jdbc.user=${JDBC_USER:root}
# Database password; override via JDBC_PASSWORD in production
jdbc.password=${JDBC_PASSWORD:123456}
# HikariCP max pool size
jdbc.pool.maximum-size=5
# HikariCP min idle connections
jdbc.pool.minimum-idle=3
# Connection acquire timeout (ms)
jdbc.pool.connection-timeout=30000
# Idle connection max lifetime before eviction (ms)
jdbc.pool.idle-timeout=600000
# Connection max lifetime (ms)
jdbc.pool.max-lifetime=1800000

# --- Center server (master.*) ---

# Center server ID
master.id=1
# Center server listen address
master.address=${MASTER_ADDRESS:127.0.0.1}
# Center server RPC port
master.port=8000

# --- Dashboard (dashboard.*) ---

# RPC topology dashboard HTTP port; 0 to disable
dashboard.port=8088

# --- RPC connect policy (rpc.connect.*) ---

# Allowed outbound node types per node type (comma-separated)
# If no rpc.connect.* is set, all nodes connect to each other
rpc.connect.external=game,http,gmback
rpc.connect.game=external,global,gmback
rpc.connect.global=game
rpc.connect.gmback=game,http
rpc.connect.http=

# --- Logging (log.*) ---

# Log level: TRACE, DEBUG, INFO, WARN, ERROR
log.level=INFO
