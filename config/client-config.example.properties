# =============================================================================
# Client tools config template (copy to client-config.properties)
# Used by: message sender, stress bot, stress statistics
# =============================================================================

# --- HTTP service (http.*) ---

# HTTP server address (for external address allocation, email login, etc.)
http.address=${HTTP_ADDRESS:127.0.0.1}
# HTTP server port
http.port=8090

# --- Logging (log.*) ---

# Log level: TRACE, DEBUG, INFO, WARN, ERROR
log.level=INFO

# --- Client connection (client.*) ---

# Protocol to connect external server: tcp, websocket, kcp
client.socket=tcp
