# =============================================================================
# GameServer config template (copy to game-config.properties)
# =============================================================================

# --- Database (jdbc.*) ---

jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/sunrise}
jdbc.user=${JDBC_USER:root}
jdbc.password=${JDBC_PASSWORD:123456}
jdbc.pool.maximum-size=5
jdbc.pool.minimum-idle=3
jdbc.pool.connection-timeout=30000
jdbc.pool.idle-timeout=600000
jdbc.pool.max-lifetime=1800000

# --- Center server (master.*) ---

master.id=1
master.address=${MASTER_ADDRESS:127.0.0.1}
master.port=8000

# --- Node report (report.*) ---

report.address=${REPORT_ADDRESS:127.0.0.1}

# --- RPC node identity (rpc.node.*) ---

rpc.node.type=game
rpc.node.server-id=200

# --- RPC registration (rpc.scan.*) ---

# Comma-separated @RpcService scan packages (required)
rpc.scan.packages=org.sunrise.game.game.service
# Generated RPC call ID enum class
rpc.call-enum-class=org.sunrise.game.genRpc.gen.CallEnum

# --- Logging (log.*) ---

log.level=DEBUG

# --- Config tables (config.*) ---

# Luban JSON config directory; relative paths resolve from this file's directory
config.path=${CONFIG_PATH:../tables/json}
# Map navigation JSON directory; files named {mapId}.nav.json
config.nav.path=${CONFIG_NAV_PATH:../tables/mapjson}

# --- Login queue (login.queue.*) ---

# Max logins allowed per second (direct + dequeue); excess waits in queue
login.queue.max-per-second=100

# --- Player auth (player.*) ---

# Require C2S_Login token on game server (must match http-config)
player.auth.enabled=false
player.jwt.secret=${PLAYER_JWT_SECRET:sunrise-player-jwt-secret-change-me-in-production-32b}
player.jwt.expiration=86400000
