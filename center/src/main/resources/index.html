<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPC 节点拓扑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0B1120;--bg-panel:#0F1729;--bg-card:#162032;--border:#1C2E4A;
      --fg:#E8EDF5;--fg-muted:#6B7FA0;--accent:#00E5CC;--accent-dim:rgba(0,229,204,.12);
      --danger:#FF6B6B;--warning:#FFB800;
      --c-external:#F472B6;--c-game:#FFB800;--c-global:#00E5CC;--c-gmback:#FF6B6B;--c-http:#38BDF8;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}
    .font-mono{font-family:'JetBrains Mono',monospace}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

    .layout{display:grid;grid-template-rows:56px 1fr 32px;grid-template-columns:260px 1fr;grid-template-areas:"hd hd" "side main" "ft ft";height:100vh}
    header{grid-area:hd;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg-panel);z-index:10}
    #left-panel{grid-area:side;background:var(--bg-panel);border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
    #canvas-wrap{grid-area:main;position:relative;overflow:hidden;background:var(--bg)}
    footer{grid-area:ft;display:flex;align-items:center;padding:0 20px;gap:16px;border-top:1px solid var(--border);background:var(--bg-panel);font-size:12px;color:var(--fg-muted)}

    .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:border-color .2s}
    .stat-card:hover{border-color:var(--accent)}
    .stat-val{font-size:28px;font-weight:700;line-height:1;font-family:'JetBrains Mono',monospace}
    .stat-label{font-size:11px;color:var(--fg-muted);margin-top:4px;letter-spacing:.5px;text-transform:uppercase}

    .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-muted)}
    .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

    .node-list-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s;font-size:13px}
    .node-list-item:hover{background:var(--accent-dim)}
    .node-list-item.active{background:var(--accent-dim);color:var(--accent)}

    #detail-panel{position:absolute;top:0;right:0;width:320px;height:100%;background:var(--bg-panel);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:20;overflow-y:auto;padding:20px}
    #detail-panel.open{transform:translateX(0)}

    .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
    .detail-row .label{color:var(--fg-muted)}
    .detail-row .value{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .conn-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--bg-card);border:1px solid var(--border);cursor:pointer;transition:all .15s}
    .conn-chip:hover{border-color:var(--accent);color:var(--accent)}

    #tooltip{position:absolute;pointer-events:none;background:rgba(15,23,41,.95);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;display:none;z-index:30;backdrop-filter:blur(8px);max-width:220px}

    .zoom-ctrl{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:10}
    .zoom-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;color:var(--fg-muted);cursor:pointer;transition:all .15s;font-size:16px}
    .zoom-btn:hover{border-color:var(--accent);color:var(--accent)}

    /* 加载遮罩 */
    #loading-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,17,32,.92);z-index:50;transition:opacity .5s}
    #loading-overlay.hidden{opacity:0;pointer-events:none}
    .loader-ring{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* 配置面板 */
    #config-panel{position:absolute;top:56px;right:0;width:380px;background:var(--bg-panel);border:1px solid var(--border);border-radius:0 0 0 12px;z-index:40;padding:20px;display:none;box-shadow:-4px 4px 24px rgba(0,0,0,.4)}
    #config-panel.open{display:block}
    .config-input{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg);font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .2s}
    .config-input:focus{border-color:var(--accent)}
    .config-label{font-size:11px;color:var(--fg-muted);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
    .config-btn{padding:8px 20px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s;border:none}
    .config-btn-primary{background:var(--accent);color:#0B1120;font-weight:600}
    .config-btn-primary:hover{opacity:.85}
    .config-btn-ghost{background:transparent;border:1px solid var(--border);color:var(--fg-muted)}
    .config-btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

    /* 通知 */
    .toast{position:fixed;top:70px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;z-index:100;transform:translateX(120%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-width:360px;backdrop-filter:blur(8px)}
    .toast.show{transform:translateX(0)}
    .toast-success{background:rgba(0,229,204,.15);border:1px solid rgba(0,229,204,.3);color:#00E5CC}
    .toast-error{background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.3);color:#FF6B6B}
    .toast-info{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38BDF8}

    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .4s ease-out both}

    .section-title{font-size:11px;font-weight:600;color:var(--fg-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
    .close-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;transition:background .15s;color:var(--fg-muted);border:none;background:transparent;font-size:18px}
    .close-btn:hover{background:var(--accent-dim);color:var(--accent)}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
    .badge-online{background:rgba(0,229,204,.12);color:#00E5CC}
    .badge-offline{background:rgba(255,107,107,.12);color:#FF6B6B}
    .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .status-dot.online{background:#00E5CC;box-shadow:0 0 6px rgba(0,229,204,.5)}
    .status-dot.offline{background:#FF6B6B;opacity:.6}
    .status-dot.connecting{background:#FFB800;animation:blink 1s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    .search-input{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 32px;color:var(--fg);font-size:13px;outline:none;transition:border-color .2s}
    .search-input:focus{border-color:var(--accent)}
    .search-wrap{position:relative}
    .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-muted);width:14px;height:14px}

    .filter-btn{padding:4px 10px;border-radius:6px;font-size:11px;border:1px solid var(--border);background:transparent;color:var(--fg-muted);cursor:pointer;transition:all .15s}
    .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

    .data-source-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500}
    .data-source-tag.live{background:rgba(0,229,204,.12);color:#00E5CC}
    .data-source-tag.demo{background:rgba(255,184,0,.12);color:#FFB800}
    .data-source-tag.error{background:rgba(255,107,107,.12);color:#FF6B6B}

    @media(max-width:768px){
      .layout{grid-template-columns:1fr;grid-template-areas:"hd" "main" "ft"}
      #left-panel{display:none}
    }
  </style>
</head>
<body>
<div class="layout">
  <header>
    <div style="display:flex;align-items:center;gap:16px">
      <h1 style="font-size:18px;font-weight:700;letter-spacing:-.5px">RPC 节点拓扑</h1>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="conn-status" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-muted)">
        <span class="status-dot connecting" id="conn-dot"></span>
        <span id="conn-text">正在连接...</span>
      </div>
      <button onclick="toggleConfig()" style="padding:6px 14px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);color:var(--fg-muted);font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--fg-muted)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        配置
      </button>
      <button onclick="resetLayout()" style="padding:6px 14px;border-radius:8px;background:var(--accent-dim);border:1px solid rgba(0,229,204,.3);color:var(--accent);font-size:12px;cursor:pointer;transition:all .15s" onmouseover="this.style.background='rgba(0,229,204,.25)'" onmouseout="this.style.background='var(--accent-dim)'">重置布局</button>
    </div>
  </header>

  <!-- 配置面板 -->
  <div id="config-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="section-title" style="margin:0">数据源配置</div>
      <button class="close-btn" onclick="toggleConfig()">×</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label class="config-label">API 地址（获取拓扑数据）</label>
        <input type="text" class="config-input" id="cfg-api-url" placeholder="http://127.0.0.1:8088/api/topology">
      </div>
      <div>
        <label class="config-label">WebSocket 地址（实时推送）</label>
        <input type="text" class="config-input" id="cfg-ws-url" placeholder="ws://localhost:8080/ws/topology">
      </div>
      <div>
        <label class="config-label">轮询间隔（毫秒，0 为不轮询）</label>
        <input type="number" class="config-input" id="cfg-poll-interval" value="5000" min="0" step="1000">
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="config-btn config-btn-primary" onclick="applyConfig()">连接</button>
      </div>
      <div id="config-msg" style="font-size:12px;min-height:18px"></div>
    </div>
  </div>

  <!-- 左侧面板 -->
  <aside id="left-panel">
    <div>
      <div class="section-title">概览</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="stat-card"><div class="stat-val" style="color:#00E5CC" id="stat-online">0</div><div class="stat-label">在线节点</div></div>
        <div class="stat-card"><div class="stat-val" style="color:#FF6B6B" id="stat-offline">0</div><div class="stat-label">离线节点</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--fg)" id="stat-bidi">0</div><div class="stat-label">双向连接</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--fg)" id="stat-uni">0</div><div class="stat-label">单向连接</div></div>
      </div>
    </div>
    <div>
      <div class="section-title">图例</div>
      <div style="display:flex;flex-direction:column;gap:6px" id="legend-container"></div>
    </div>
    <div>
      <div class="section-title">筛选</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px" id="filter-btns"></div>
    </div>
    <div style="flex:1;min-height:0">
      <div class="section-title">节点列表</div>
      <div class="search-wrap" style="margin-bottom:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" class="search-input" placeholder="搜索节点..." id="search-input">
      </div>
      <div id="node-list" style="display:flex;flex-direction:column;gap:2px;overflow-y:auto;max-height:calc(100vh - 520px)"></div>
    </div>
  </aside>

  <!-- 主画布 -->
  <div id="canvas-wrap">
    <canvas id="graph-canvas"></canvas>
    <div id="tooltip"></div>
    <div class="zoom-ctrl">
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <button class="zoom-btn" onclick="zoomOut()">−</button>
      <button class="zoom-btn" onclick="zoomFit()" style="font-size:12px">⊡</button>
    </div>
    <div id="detail-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="section-title" style="margin:0">节点详情</div>
        <button class="close-btn" onclick="closeDetail()">×</button>
      </div>
      <div id="detail-content"></div>
    </div>
    <!-- 加载遮罩 -->
    <div id="loading-overlay">
      <div class="loader-ring"></div>
      <div style="margin-top:16px;color:var(--fg-muted);font-size:14px" id="loading-text">正在连接...</div>
    </div>
  </div>

  <footer>
    <span class="font-mono" id="footer-info">0 节点 · 0 连接</span>
    <span style="margin-left:auto" class="font-mono" id="footer-zoom">100%</span>
  </footer>
</div>

<!-- 通知容器 -->
<div id="toast-container"></div>

<script>
  // ========== 类型系统：动态注册 ==========
  const TYPE_COLORS = { external:'#F472B6', game:'#FFB800', global:'#00E5CC', gmback:'#FF6B6B', http:'#38BDF8' };
  const TYPE_LABELS = { external:'External', game:'Game', global:'Global', gmback:'GM-Back', http:'HTTP' };

  function registerType(type) {
    if (!TYPE_COLORS[type]) {
      // 为未知类型生成颜色
      let hash = 0;
      for (let i = 0; i < type.length; i++) hash = type.charCodeAt(i) + ((hash << 5) - hash);
      const h = Math.abs(hash) % 360;
      TYPE_COLORS[type] = `hsl(${h},70%,60%)`;
      TYPE_LABELS[type] = type.charAt(0).toUpperCase() + type.slice(1);
    }
  }

  // ========== 全局状态 ==========
  let nodes = [], edges = [];
  let nodeMap = {};
  let selectedNode = null, hoveredNode = null;
  let dragNode = null, isPanning = false;
  let panX = 0, panY = 0, scale = 1;
  let mouseDownX = 0, mouseDownY = 0;
  let hasDragged = false;
  let activeFilters = new Set();
  let dashOffset = 0;
  let ws = null;
  let pollTimer = null;
  let isLiveData = false;

  // ========== 通知系统 ==========
  function showToast(msg, type = 'info', duration = 4000) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  // ========== 数据加载 ==========
  // 从 API 获取拓扑数据，适配多种常见返回格式
  async function fetchTopology(apiUrl) {
    const resp = await fetch(apiUrl);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    const data = await resp.json();
    return normalizeTopology(data);
  }

  // 将各种格式统一为 { nodes: [...], edges: [...] }
  function normalizeTopology(data) {
    let rawNodes = [], rawEdges = [];

    // 格式1: { nodes: [...], edges/connections/links: [...] }
    if (data.nodes && Array.isArray(data.nodes)) {
      rawNodes = data.nodes;
      rawEdges = data.edges || data.connections || data.links || [];
    }
    // 格式2: { topology: { nodes, edges } }
    else if (data.topology) {
      return normalizeTopology(data.topology);
    }
    // 格式3: 单个节点对象（自身节点上报）
    else if (data.id || data.nodeId || data.name) {
      rawNodes = [data];
      rawEdges = data.connections || data.peers || data.edges || [];
    }
    // 格式4: 数组
    else if (Array.isArray(data)) {
      // 如果第一个元素有 source/target，视为边列表
      if (data.length > 0 && (data[0].source || data[0].target)) {
        rawEdges = data;
      } else {
        rawNodes = data;
      }
    }

    // 标准化节点（兼容中心服 API：nodeType、online、serverId）
    const nodesResult = rawNodes.map(n => {
      const id = n.id || n.nodeId || n.name;
      const type = (n.nodeType || n.type || n.group || n.category || 'default').toLowerCase();
      let status;
      if (typeof n.online === 'boolean') {
        status = n.online ? 'online' : 'offline';
      } else {
        status = String(n.status || n.state || 'online').toLowerCase();
      }
      const serverId = n.serverId ?? n.server_id;
      const defaultName = serverId != null && serverId !== '' ? `${type}-${serverId}` : null;
      return {
        id,
        name: n.name || defaultName || id || 'Unknown',
        type,
        status,
        ip: n.ip || n.host || n.address || '',
        port: n.port || 0,
        region: n.region || n.zone || n.datacenter || '',
        extra: n.extra || n.metadata || n.info || {},
        _raw: n
      };
    });

    // 标准化边
    const edgesResult = rawEdges.map(e => {
      if (typeof e === 'string') {
        // 简单字符串表示连接目标
        return { source: null, target: e, type: 'bidirectional' };
      }
      return {
        source: e.source || e.from || e.src,
        target: e.target || e.to || e.dst,
        type: (e.type || e.direction || 'bidirectional').toLowerCase() === 'unidirectional' ? 'unidirectional' : 'bidirectional',
        latency: e.latency || e.delay || e.rtt || 0,
        _raw: e
      };
    });

    const result = { nodes: nodesResult, edges: edgesResult };
    if (data.stats && typeof data.stats === 'object') {
      result.stats = data.stats;
    }
    return result;
  }

  // WebSocket 连接
  function connectWebSocket(wsUrl) {
    if (ws) { ws.close(); ws = null; }
    try {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        updateConnectionStatus('online', 'WebSocket 已连接');
        showToast('WebSocket 连接成功', 'success');
      };
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const topo = normalizeTopology(data);
          applyTopology(topo, true);
        } catch (e) {
          console.warn('WebSocket 消息解析失败:', e);
        }
      };
      ws.onclose = () => {
        updateConnectionStatus('offline', 'WebSocket 断开');
        // 自动重连
        setTimeout(() => {
          if (isLiveData) connectWebSocket(wsUrl);
        }, 5000);
      };
      ws.onerror = () => {
        updateConnectionStatus('error', 'WebSocket 错误');
      };
    } catch (e) {
      console.error('WebSocket 连接失败:', e);
    }
  }

  // 轮询
  function startPolling(apiUrl, interval) {
    stopPolling();
    if (interval <= 0) return;
    pollTimer = setInterval(async () => {
      try {
        const topo = await fetchTopology(apiUrl);
        applyTopology(topo, true);
      } catch (e) {
        // 静默失败，不干扰用户
        console.warn('轮询失败:', e.message);
      }
    }, interval);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ========== 应用拓扑数据到图形 ==========
  function applyTopology(topo, isUpdate = false, apiStats = null) {
    const oldNodeMap = {};
    nodes.forEach(n => oldNodeMap[n.id] = n);

    const cx = canvas.width / (window.devicePixelRatio || 1) / 2;
    const cy = canvas.height / (window.devicePixelRatio || 1) / 2;

    // 注册新类型
    topo.nodes.forEach(n => registerType(n.type));

    // 合并节点：保留已有位置
    nodes = topo.nodes.map((n, i) => {
      const existing = oldNodeMap[n.id];
      if (existing) {
        // 更新属性但保留位置
        Object.assign(existing, { name:n.name, type:n.type, status:n.status, ip:n.ip, port:n.port, region:n.region, extra:n.extra, _raw:n._raw });
        return existing;
      }
      // 新节点：圆形布局
      const angle = (i / Math.max(topo.nodes.length, 1)) * Math.PI * 2;
      const r = 150 + Math.random() * 120;
      return {
        ...n, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r,
        vx: 0, vy: 0, radius: n.type === 'global' ? 22 : 16, pinned: false
      };
    });

    // 重建索引
    nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    // 标准化边中的 source/target（处理自身节点场景）
    edges = topo.edges.map(e => {
      // 如果 source 为空，可能表示"从当前节点出发"
      if (!e.source && nodes.length > 0) e.source = nodes[0].id;
      if (!e.target && nodes.length > 0) e.target = nodes[0].id;
      return e;
    }).filter(e => e.source && e.target && nodeMap[e.source] && nodeMap[e.target]);

    // 更新界面
    updateStats(apiStats || topo.stats);
    rebuildLegend();
    buildFilterButtons();
    buildNodeList();

    if (!isUpdate) {
      // 初次加载，适配视图
      setTimeout(zoomFit, 300);
    }

    // 隐藏加载遮罩
    document.getElementById('loading-overlay').classList.add('hidden');
  }

  // ========== 配置面板 ==========
  function toggleConfig() {
    document.getElementById('config-panel').classList.toggle('open');

    document.getElementById('config-panel').classList.remove('open');

  async function applyConfig() {
    const apiUrl = document.getElementById('cfg-api-url').value.trim();
    const wsUrl = document.getElementById('cfg-ws-url').value.trim();
    const pollInterval = parseInt(document.getElementById('cfg-poll-interval').value) || 0;
    const msgEl = document.getElementById('config-msg');

    if (!apiUrl && !wsUrl) {
      msgEl.innerHTML = '<span style="color:#FF6B6B">请至少填写 API 地址或 WebSocket 地址</span>';
      return;
    }

    msgEl.innerHTML = '<span style="color:#FFB800">正在连接...</span>';
    updateConnectionStatus('connecting', '正在连接...');

    // 保存配置到 localStorage
    const config = { apiUrl, wsUrl, pollInterval };
    localStorage.setItem('rpc-topo-config', JSON.stringify(config));

    if (apiUrl) {
      try {
        const topo = await fetchTopology(apiUrl);
        applyTopology(topo);
        isLiveData = true;
        updateConnectionStatus('online', 'API 已连接');
        updateDataSourceTag('live');
        showToast(`已从 API 加载 ${topo.nodes.length} 个节点`, 'success');
        msgEl.innerHTML = '<span style="color:#00E5CC">API 连接成功</span>';

        // 启动轮询
        startPolling(apiUrl, pollInterval);
      } catch (e) {
        msgEl.innerHTML = `<span style="color:#FF6B6B">API 连接失败: ${e.message}</span>`;
        updateConnectionStatus('error', '连接失败');
        showToast(`API 连接失败: ${e.message}`, 'error');
      }
    }

    if (wsUrl) {
      connectWebSocket(wsUrl);
    }

    if (apiUrl || wsUrl) {
      setTimeout(closeConfig, 1000);
    }
  }

  function loadSavedConfig() {
    try {
      const saved = JSON.parse(localStorage.getItem('rpc-topo-config'));
      if (saved) {
        document.getElementById('cfg-api-url').value = saved.apiUrl || '';
        document.getElementById('cfg-ws-url').value = saved.wsUrl || '';

  // ========== 连接状态 ==========
  function updateConnectionStatus(state, text) {

    const label = document.getElementById('conn-text');

  // ========== 力导向模拟 ==========
  const SIM = { repulsion:8000, attraction:0.005, damping:0.85, centerGravity:0.008, idealDist:180 };

  function isVisible(node) {
    if (activeFilters.size === 0) return true;
    return activeFilters.has(node.type);
  }

  function simulate() {
    if (nodes.length === 0) return;
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const cx = w / 2, cy = h / 2;
    const vis = nodes.filter(n => isVisible(n));

    for (let i = 0; i < vis.length; i++) {
      for (let j = i + 1; j < vis.length; j++) {
        const a = vis[i], b = vis[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.max(Math.sqrt(dx*dx+dy*dy), 1);
        const f = SIM.repulsion / (dist*dist);
        const fx = (dx/dist)*f, fy = (dy/dist)*f;
        if (!a.pinned){a.vx-=fx;a.vy-=fy;}
        if (!b.pinned){b.vx+=fx;b.vy+=fy;}
      }
    }

    for (const e of edges) {
      const s = nodeMap[e.source], t = nodeMap[e.target];
      if (!s||!t||!isVisible(s)||!isVisible(t)) continue;
      let dx = t.x-s.x, dy = t.y-s.y;
      const dist = Math.max(Math.sqrt(dx*dx+dy*dy),1);
      const f = SIM.attraction*(dist-SIM.idealDist);
      const fx = (dx/dist)*f, fy = (dy/dist)*f;
      if (!s.pinned){s.vx+=fx;s.vy+=fy;}
      if (!t.pinned){t.vx-=fx;t.vy-=fy;}
    }

    for (const n of vis) {
      if (n.pinned) continue;
      n.vx -= (n.x-cx)*SIM.centerGravity;
      n.vy -= (n.y-cy)*SIM.centerGravity;
      n.vx *= SIM.damping; n.vy *= SIM.damping;
      n.x += n.vx; n.y += n.vy;
    }
  }

  // ========== Canvas ==========
  const canvas = document.getElementById('graph-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    canvas.style.width = wrap.clientWidth + 'px';
    canvas.style.height = wrap.clientHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function worldToScreen(wx,wy){return{x:wx*scale+panX,y:wy*scale+panY}}
  function screenToWorld(sx,sy){return{x:(sx-panX)/scale,y:(sy-panY)/scale}}

  // ========== 渲染 ==========
  function render() {
    const w = canvas.width/(window.devicePixelRatio||1);
    const h = canvas.height/(window.devicePixelRatio||1);
    ctx.clearRect(0,0,w,h);
    drawGrid(w,h);
    dashOffset -= 0.3;
    for (const e of edges) {
      const s = nodeMap[e.source], t = nodeMap[e.target];
      if (!s||!t||!isVisible(s)||!isVisible(t)) continue;
      drawEdge(s,t,e);
    }
    for (const n of nodes) {
      if (!isVisible(n)) continue;
      drawNode(n);
    }
  }

  function drawGrid(w,h) {
    const step = 50*scale;
    if (step<10) return;
    const offX=panX%step, offY=panY%step;
    ctx.strokeStyle='rgba(30,46,74,0.25)';ctx.lineWidth=0.5;ctx.beginPath();
    for(let x=offX;x<w;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,h);}
    for(let y=offY;y<h;y+=step){ctx.moveTo(0,y);ctx.lineTo(w,y);}
    ctx.stroke();
  }

  function drawEdge(s,t,e) {
    const sp=worldToScreen(s.x,s.y), tp=worldToScreen(t.x,t.y);
    const isHL=selectedNode&&(selectedNode.id===s.id||selectedNode.id===t.id);
    const isHoverHL=hoveredNode&&(hoveredNode.id===s.id||hoveredNode.id===t.id);
    const alpha=(isHL||isHoverHL)?0.8:0.3;
    ctx.save();
    if (e.type==='bidirectional') {
      ctx.strokeStyle=`rgba(0,229,204,${alpha})`;ctx.lineWidth=isHL?2:1.2;ctx.setLineDash([]);
    } else {
      ctx.strokeStyle=`rgba(107,127,160,${alpha})`;ctx.lineWidth=isHL?1.8:1;
      ctx.setLineDash([6,4]);ctx.lineDashOffset=dashOffset;
    }
    ctx.beginPath();ctx.moveTo(sp.x,sp.y);ctx.lineTo(tp.x,tp.y);ctx.stroke();
    if (e.type==='unidirectional') {
      const angle=Math.atan2(tp.y-sp.y,tp.x-sp.x);
      const r=t.radius*scale;
      const ax=tp.x-Math.cos(angle)*(r+4), ay=tp.y-Math.sin(angle)*(r+4);
      const sz=6+scale*2;
      ctx.setLineDash([]);ctx.fillStyle=`rgba(107,127,160,${alpha})`;
      ctx.beginPath();ctx.moveTo(ax,ay);
      ctx.lineTo(ax-Math.cos(angle-0.4)*sz,ay-Math.sin(angle-0.4)*sz);
      ctx.lineTo(ax-Math.cos(angle+0.4)*sz,ay-Math.sin(angle+0.4)*sz);
      ctx.closePath();ctx.fill();
    }
    // 延迟标签（高亮时显示）
    if (e.latency && (isHL||isHoverHL) && scale > 0.5) {
      const mx=(sp.x+tp.x)/2, my=(sp.y+tp.y)/2;
      ctx.font=`${Math.max(9,10*scale)}px "JetBrains Mono",monospace`;
      ctx.fillStyle='rgba(232,237,245,0.7)';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(e.latency+'ms',mx,my-4);
    }
    ctx.restore();
  }

  function drawNode(n) {
    const p=worldToScreen(n.x,n.y);
    const r=n.radius*scale;
    const color=TYPE_COLORS[n.type]||'#888';
    const isSelected=selectedNode&&selectedNode.id===n.id;
    const isHovered=hoveredNode&&hoveredNode.id===n.id;
    const isConnected=selectedNode&&edges.some(e=>(e.source===selectedNode.id&&e.target===n.id)||(e.target===selectedNode.id&&e.source===n.id));
    const dimmed=selectedNode&&!isSelected&&!isConnected;

    ctx.save();
    ctx.globalAlpha=dimmed?0.2:(n.status==='offline'?0.5:1);

    // 在线脉冲光晕
    if (n.status==='online'&&!dimmed) {
      const pulseR=r*(1.6+0.3*Math.sin(Date.now()/800));
      const grad=ctx.createRadialGradient(p.x,p.y,r*0.5,p.x,p.y,pulseR);
      grad.addColorStop(0,color+'30');grad.addColorStop(1,color+'00');
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(p.x,p.y,pulseR,0,Math.PI*2);ctx.fill();
    }

    // 选中环
    if (isSelected){ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,Math.PI*2);ctx.stroke();}
    // hover环
    if (isHovered&&!isSelected){ctx.strokeStyle=color+'80';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,Math.PI*2);ctx.stroke();}

    // 节点主体
    const ng=ctx.createRadialGradient(p.x-r*0.25,p.y-r*0.25,0,p.x,p.y,r);
    ng.addColorStop(0,lighten(color,30));ng.addColorStop(1,color);
    ctx.fillStyle=ng;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();

    // 离线X
    if (n.status==='offline'){
      ctx.strokeStyle='#0B1120';ctx.lineWidth=2.5;
      const s=r*0.45;ctx.beginPath();
      ctx.moveTo(p.x-s,p.y-s);ctx.lineTo(p.x+s,p.y+s);
      ctx.moveTo(p.x+s,p.y-s);ctx.lineTo(p.x-s,p.y+s);ctx.stroke();
    }

    // 名称
    if (scale>0.4){
      ctx.fillStyle=dimmed?'rgba(232,237,245,0.15)':'#E8EDF5';
      ctx.font=`${Math.max(10,11*scale)}px "Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(n.name,p.x,p.y+r+6);
    }
    ctx.restore();
  }

  function lighten(hex,pct){
    if (hex.startsWith('hsl')) return hex; // HSL 颜色简化处理
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.min(255,r+pct);g=Math.min(255,g+pct);b=Math.min(255,b+pct);
    return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
  }

  // ========== 主循环 ==========
  function loop(){simulate();render();requestAnimationFrame(loop);}

  // ========== 交互 ==========
  function getNodeAt(sx,sy){
    const wp=screenToWorld(sx,sy);
    for(let i=nodes.length-1;i>=0;i--){
      const n=nodes[i];if(!isVisible(n))continue;
      const dx=wp.x-n.x,dy=wp.y-n.y;
      if(dx*dx+dy*dy<(n.radius+4)*(n.radius+4))return n;
    }
    return null;
  }

  canvas.addEventListener('mousedown',e=>{
    const rect=canvas.getBoundingClientRect();
    const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
    mouseDownX=sx;mouseDownY=sy;hasDragged=false;
    const node=getNodeAt(sx,sy);
    if(node){dragNode=node;dragNode.pinned=true;}
    else isPanning=true;
  });

  canvas.addEventListener('mousemove',e=>{
    const rect=canvas.getBoundingClientRect();
    const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
    if(dragNode){
      const wp=screenToWorld(sx,sy);
      dragNode.x=wp.x;dragNode.y=wp.y;dragNode.vx=0;dragNode.vy=0;hasDragged=true;
    }else if(isPanning){
      panX+=sx-mouseDownX;panY+=sy-mouseDownY;mouseDownX=sx;mouseDownY=sy;hasDragged=true;
    }else{
      const node=getNodeAt(sx,sy);hoveredNode=node;
      canvas.style.cursor=node?'pointer':'grab';
      updateTooltip(node,e.clientX,e.clientY);
    }
  });

  canvas.addEventListener('mouseup',e=>{
    if(dragNode){dragNode.pinned=false;if(!hasDragged)selectNode(dragNode);dragNode=null;}
    else if(isPanning){isPanning=false;if(!hasDragged)selectNode(null);}
  });

  canvas.addEventListener('mouseleave',()=>{hoveredNode=null;document.getElementById('tooltip').style.display='none';});

  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
    const delta=e.deltaY>0?0.9:1.1;
    const newScale=Math.max(0.15,Math.min(4,scale*delta));
    const ratio=newScale/scale;
    panX=sx-(sx-panX)*ratio;panY=sy-(sy-panY)*ratio;
    scale=newScale;
    document.getElementById('footer-zoom').textContent=Math.round(scale*100)+'%';
  },{passive:false});

  // 触摸支持
  let lastTouchDist=0;
  canvas.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      const t=e.touches[0],rect=canvas.getBoundingClientRect();
      mouseDownX=t.clientX-rect.left;mouseDownY=t.clientY-rect.top;hasDragged=false;
      const node=getNodeAt(mouseDownX,mouseDownY);
      if(node){dragNode=node;dragNode.pinned=true;}else isPanning=true;
    }else if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      lastTouchDist=Math.sqrt(dx*dx+dy*dy);
    }
  },{passive:true});

  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1){
      const t=e.touches[0],rect=canvas.getBoundingClientRect();
      const sx=t.clientX-rect.left,sy=t.clientY-rect.top;
      if(dragNode){const wp=screenToWorld(sx,sy);dragNode.x=wp.x;dragNode.y=wp.y;dragNode.vx=0;dragNode.vy=0;hasDragged=true;}
      else if(isPanning){panX+=sx-mouseDownX;panY+=sy-mouseDownY;mouseDownX=sx;mouseDownY=sy;hasDragged=true;}
    }else if(e.touches.length===2&&lastTouchDist){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const ratio=dist/lastTouchDist;
      const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
      const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
      const rect=canvas.getBoundingClientRect();
      const sx=cx-rect.left,sy=cy-rect.top;
      const newScale=Math.max(0.15,Math.min(4,scale*ratio));
      const r=newScale/scale;
      panX=sx-(sx-panX)*ratio;panY=sy-(sy-panY)*ratio;
      scale=newScale;lastTouchDist=dist;
      document.getElementById('footer-zoom').textContent=Math.round(scale*100)+'%';
    }
  },{passive:false});

  canvas.addEventListener('touchend',()=>{if(dragNode){dragNode.pinned=false;dragNode=null;}isPanning=false;lastTouchDist=0;});

  // ========== Tooltip ==========
  function updateTooltip(node,cx,cy){
    const tip=document.getElementById('tooltip');
    if(!node){tip.style.display='none';return;}
    const conns=edges.filter(e=>e.source===node.id||e.target===node.id).length;
    const color=TYPE_COLORS[node.type]||'#888';
    const label=TYPE_LABELS[node.type]||node.type;
    tip.innerHTML=`
    <div style="font-weight:600;margin-bottom:4px">${node.name}</div>
    <div style="color:var(--fg-muted);font-size:11px"><span style="color:${color}">${label}</span> · ${node.status==='online'?'<span style="color:#00E5CC">在线</span>':'<span style="color:#FF6B6B">离线</span>'}</div>
    ${node.ip?`<div style="color:var(--fg-muted);font-size:11px;margin-top:2px">${node.ip}${node.port?':'+node.port:''}</div>`:''}
    <div style="color:var(--fg-muted);font-size:11px;margin-top:2px">${conns} 个连接</div>
  `;
    tip.style.display='block';
    const wrap=document.getElementById('canvas-wrap').getBoundingClientRect();
    let tx=cx-wrap.left+14,ty=cy-wrap.top+14;
    if(tx+220>wrap.width)tx=cx-wrap.left-230;
    if(ty+100>wrap.height)ty=cy-wrap.top-110;
    tip.style.left=tx+'px';tip.style.top=ty+'px';
  }

  // ========== 节点选中/详情 ==========
  function selectNode(node){
    selectedNode=node;
    const panel=document.getElementById('detail-panel');
    const content=document.getElementById('detail-content');
    document.querySelectorAll('.node-list-item').forEach(el=>el.classList.toggle('active',node&&el.dataset.id===node.id));

    if(!node){panel.classList.remove('open');return;}

    const conns=edges.filter(e=>e.source===node.id||e.target===node.id);
    const connHTML=conns.map(e=>{
      const otherId=e.source===node.id?e.target:e.source;
      const other=nodeMap[otherId];
      if(!other)return '';
      const dir=e.type==='bidirectional'?'↔':(e.source===node.id?'→':'←');
      const color=TYPE_COLORS[other.type]||'#888';
      return `<span class="conn-chip" onclick="focusNode('${otherId}')">
      <span style="width:6px;height:6px;border-radius:50%;background:${color}"></span>
      ${dir} ${other.name}${e.latency?' <span style="color:var(--fg-muted)">'+e.latency+'ms</span>':''}
    </span>`;
    }).join('');

    // 构建 extra 信息
    let extraHTML = '';
    const extra = node.extra || {};
    const extraKeys = Object.keys(extra);
    if (extraKeys.length > 0) {
      extraHTML = `<div style="margin-top:16px"><div class="section-title">扩展信息</div>`;
      for (const k of extraKeys) {
        extraHTML += `<div class="detail-row"><span class="label">${k}</span><span class="value">${typeof extra[k]==='object'?JSON.stringify(extra[k]):extra[k]}</span></div>`;
      }
      extraHTML += '</div>';
    }

    const color=TYPE_COLORS[node.type]||'#888';
    const label=TYPE_LABELS[node.type]||node.type;

    content.innerHTML=`
    <div class="fade-in">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:40px;height:40px;border-radius:10px;background:${color}20;display:flex;align-items:center;justify-content:center">
          <div style="width:16px;height:16px;border-radius:50%;background:${color}"></div>
        </div>
        <div>
          <div style="font-weight:700;font-size:16px">${node.name}</div>
          <span class="badge ${node.status==='online'?'badge-online':'badge-offline'}">
            <span class="status-dot ${node.status}"></span>${node.status==='online'?'在线':'离线'}
          </span>
        </div>
      </div>
      <div class="detail-row"><span class="label">类型</span><span class="value" style="color:${color}">${label}</span></div>
      ${node._raw && node._raw.serverId != null ? `<div class="detail-row"><span class="label">Server ID</span><span class="value">${node._raw.serverId}</span></div>` : ''}
      ${node._raw && node._raw.nodeId ? `<div class="detail-row"><span class="label">Node ID</span><span class="value" title="${node._raw.nodeId}">${node._raw.nodeId}</span></div>` : ''}
      ${node.ip?`<div class="detail-row"><span class="label">地址</span><span class="value">${node.ip}${node.port?':'+node.port:''}</span></div>`:''}
      ${node.region?`<div class="detail-row"><span class="label">区域</span><span class="value">${node.region}</span></div>`:''}
      <div class="detail-row"><span class="label">连接数</span><span class="value">${conns.length}</span></div>
      <div style="margin-top:16px">
        <div class="section-title">连接关系</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${connHTML||'<span style="color:var(--fg-muted);font-size:12px">无连接</span>'}</div>
      </div>
      ${extraHTML}
    </div>
  `;
    panel.classList.add('open');
  }

  function closeDetail(){selectNode(null);}

  function focusNode(id){
    const node=nodeMap[id];
    if(!node)return;
    selectNode(node);
    const wrap=document.getElementById('canvas-wrap');
    panX=wrap.clientWidth/2-node.x*scale;
    panY=wrap.clientHeight/2-node.y*scale;
  }

  // ========== 缩放 ==========
  function zoomIn(){
    const wrap=document.getElementById('canvas-wrap');const cx=wrap.clientWidth/2,cy=wrap.clientHeight/2;
    const ns=Math.min(4,scale*1.3);const r=ns/scale;panX=cx-(cx-panX)*r;panY=cy-(cy-panY)*r;scale=ns;
    document.getElementById('footer-zoom').textContent=Math.round(scale*100)+'%';
  }
  function zoomOut(){
    const wrap=document.getElementById('canvas-wrap');const cx=wrap.clientWidth/2,cy=wrap.clientHeight/2;
    const ns=Math.max(0.15,scale/1.3);const r=ns/scale;panX=cx-(cx-panX)*r;panY=cy-(cy-panY)*r;scale=ns;
    document.getElementById('footer-zoom').textContent=Math.round(scale*100)+'%';
  }
  function zoomFit(){
    const wrap=document.getElementById('canvas-wrap');const vis=nodes.filter(n=>isVisible(n));
    if(!vis.length)return;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const n of vis){minX=Math.min(minX,n.x-n.radius);minY=Math.min(minY,n.y-n.radius);maxX=Math.max(maxX,n.x+n.radius);maxY=Math.max(maxY,n.y+n.radius);}
    const pw=maxX-minX+120,ph=maxY-minY+120;
    scale=Math.min(wrap.clientWidth/pw,wrap.clientHeight/ph,2);
    panX=(wrap.clientWidth-(minX+maxX)*scale)/2;panY=(wrap.clientHeight-(minY+maxY)*scale)/2;
    document.getElementById('footer-zoom').textContent=Math.round(scale*100)+'%';
  }

  function resetLayout(){
    const w=canvas.width/(window.devicePixelRatio||1),h=canvas.height/(window.devicePixelRatio||1);
    const cx=w/2,cy=h/2;
    nodes.forEach((n,i)=>{
      const angle=(i/Math.max(nodes.length,1))*Math.PI*2;
      const r=150+Math.random()*120;
      n.x=cx+Math.cos(angle)*r;n.y=cy+Math.sin(angle)*r;n.vx=0;n.vy=0;
    });
    scale=1;panX=0;panY=0;zoomFit();
  }

  // ========== UI 更新 ==========
  function updateStats(apiStats){
    let online, offline, bidi, uni;
    if (apiStats) {
      online = apiStats.onlineNodes ?? apiStats.online ?? 0;
      offline = apiStats.offlineNodes ?? apiStats.offline ?? 0;
      bidi = apiStats.bidirectionalEdges ?? 0;
      uni = apiStats.unidirectionalEdges ?? 0;
    } else {
      online = nodes.filter(n => n.status === 'online').length;
      offline = nodes.filter(n => n.status === 'offline').length;
      bidi = edges.filter(e => e.type === 'bidirectional').length;
      uni = edges.filter(e => e.type === 'unidirectional').length;
    }
    document.getElementById('stat-online').textContent = online;
    document.getElementById('stat-offline').textContent = offline;
    document.getElementById('stat-bidi').textContent = bidi;
    document.getElementById('stat-uni').textContent = uni;
    document.getElementById('footer-info').textContent = `${nodes.length} 节点 · ${edges.length} 连接`;
  }

  function rebuildLegend(){
    const container=document.getElementById('legend-container');
    const types=[...new Set(nodes.map(n=>n.type))];
    // 固定图例项：连接类型
    let html = `
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>双向连接</div>
    <div class="legend-item"><span style="width:10px;height:2px;border-top:2px dashed var(--fg-muted);flex-shrink:0"></span>单向连接</div>
    <div style="height:1px;background:var(--border);margin:4px 0"></div>
  `;
    // 动态类型图例
    types.forEach(t=>{
      const color=TYPE_COLORS[t]||'#888';
      html+=`<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${TYPE_LABELS[t]||t}</div>`;
    });
    container.innerHTML=html;
  }

  function buildFilterButtons(){
    const container=document.getElementById('filter-btns');
    const types=[...new Set(nodes.map(n=>n.type))];
    container.innerHTML=types.map(t=>{
      const color=TYPE_COLORS[t]||'#888';
      const isActive=activeFilters.has(t);
      return `<button class="filter-btn ${isActive?'active':''}" data-type="${t}" style="border-color:${color}30;color:${color};${isActive?'background:'+color+'20':''}" onclick="toggleFilter('${t}',this,'${color}')">${TYPE_LABELS[t]||t}</button>`;
    }).join('');
  }

  function toggleFilter(type,btn,color){
    if(activeFilters.has(type)){activeFilters.delete(type);btn.classList.remove('active');btn.style.background='transparent';}
    else{activeFilters.add(type);btn.classList.add('active');btn.style.background=color+'20';}
  }

  function buildNodeList(){
    const container=document.getElementById('node-list');
    const search=document.getElementById('search-input').value.toLowerCase();
    const filtered=nodes.filter(n=>isVisible(n)&&(n.name.toLowerCase().includes(search)||n.id.toLowerCase().includes(search)||(n.ip&&n.ip.includes(search))));
    container.innerHTML=filtered.map(n=>{
      const color=TYPE_COLORS[n.type]||'#888';
      return `<div class="node-list-item ${selectedNode&&selectedNode.id===n.id?'active':''}" data-id="${n.id}" onclick="focusNode('${n.id}')">
      <span class="status-dot ${n.status}"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.name}</span>
      ${n.ip?`<span class="font-mono" style="font-size:10px;color:var(--fg-muted)">${n.ip}</span>`:''}
    </div>`;
    }).join('');
  }

  document.getElementById('search-input').addEventListener('input',buildNodeList);

  // ========== 初始化 ==========
  function init(){
    resizeCanvas();
    updateStats();
    buildNodeList();
    loop();

    // 尝试自动连接保存的配置
    const autoConnected = loadSavedConfig();
    if (!autoConnected) {
      // 没有保存的配置，尝试默认地址
      tryAutoConnect();
    }
  }

  async function tryAutoConnect() {
    // 尝试常见的本地 API 地址
    const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
    const candidates = [
      window.location.origin + '/api/topology',
      window.location.origin + '/topology',
      `http://127.0.0.1:${port}/api/topology`,
      'http://127.0.0.1:8088/api/topology',
    ];

    for (const url of candidates) {
      try {
        const topo = await fetchTopology(url);
        applyTopology(topo);
        isLiveData = true;
        updateConnectionStatus('online', 'API 已连接');
        updateDataSourceTag('live');
        // 保存成功的配置
        document.getElementById('cfg-api-url').value = url;
        showToast(`自动连接成功: ${url}`, 'success');
        return;
      } catch(e) {
        // 继续尝试下一个
      }
    }

    document.getElementById('loading-overlay').classList.add('hidden');
    document.getElementById('loading-text').textContent = '未连接到 API，请在配置中填写地址';
    updateConnectionStatus('offline', '未连接');
    updateDataSourceTag('error');
  }

  window.addEventListener('resize',()=>{resizeCanvas();if(nodes.length>0)zoomFit();});

  init();
</script>
</body>
</html>
